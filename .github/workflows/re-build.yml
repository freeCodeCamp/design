name: Build

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-tooling
      - name: Build all packages
        run: pnpm build
